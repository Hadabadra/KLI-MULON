name: release
on:
  push:
    branches: [main]
    paths: [manifest.json]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build .otzplugin
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          V=$(jq -r .version manifest.json)
          if gh release view "v$V" >/dev/null 2>&1; then echo "v$V already released"; echo "SKIP=1" >> $GITHUB_ENV; exit 0; fi
          python3 tools/build_roadmap.py docs/ROADMAP.md data/roadmap.js && python3 tools/build_roadmap.py CHANGELOG.md data/changelog.js KK_CHANGELOG
          zip -qr "milon-klei-kodesh-$V.otzplugin" manifest.json index.html background.html css js data icon docs
          sha256sum "milon-klei-kodesh-$V.otzplugin" > SHA256.txt
          awk "/^## $V/{f=1;next}/^## /{f=0}f" CHANGELOG.md > notes.md
          printf '\n### Checksum\n```\n%s\n```\n' "$(cat SHA256.txt)" >> notes.md
          echo "V=$V" >> $GITHUB_ENV
      - name: Release
        if: env.SKIP != '1'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "v$V" "milon-klei-kodesh-$V.otzplugin" --title "מילון כליקודש $V" --notes-file notes.md --target "$GITHUB_SHA"
