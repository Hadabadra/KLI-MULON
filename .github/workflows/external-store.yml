name: פרסום תוספים מריפו אחר לחנות אוצריא

# מפרסם לחנות תוספים שהריפו שלהם אינו מחזיק את פרטי החנות (OTZARIA_USER / OTZARIA_PASSWORD).
# הסודות שמורים כאן, ולכן הפרסום רץ מכאן: כל 3 שעות, או ידנית מלשונית Actions.
# גרסה שכבר קיימת בחנות לא מתפרסמת שוב (publish: auto), כך שמספיק להעלות את הגרסה ב-manifest.json במקור.

on:
  schedule:
    - cron: '41 */3 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'לפרסם גם אם הגרסה כבר קיימת'
        type: boolean
        default: false
  push:
    branches: [main]
    paths: ['.github/workflows/external-store.yml']

permissions:
  contents: read

concurrency:
  group: external-store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: מצב קריאה
            repo: Hadabadra/Reading-mode
            ref: main
            dir: src
          - name: ברכת המזון
            repo: Hadabadra/Prayer-pointA
            ref: ברכת-המזון
            dir: src
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: ext
      - name: גרסה
        run: node -p "'${{ matrix.name }} ' + require('./ext/${{ matrix.dir }}/manifest.json').version"
      - name: ולידציה, קיפול ופרסום
        timeout-minutes: 6
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: ext/${{ matrix.dir }}
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
          publish: 'auto'
          force: ${{ github.event.inputs.force || false }}
          reports-consent: 'true'
