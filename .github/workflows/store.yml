name: פרסום לחנות אוצריא

# מפרסם את "לשון הקודש" (milon-klei-kodesh) לחנות אוצריא.
# רץ בכל דחיפה ל-main שמשנה את manifest.json, וגם ידנית מלשונית Actions.
# גרסה שכבר קיימת בחנות לא מתפרסמת שוב (publish: auto). סודות: OTZARIA_USER / OTZARIA_PASSWORD.

on:
  push:
    branches: [main]
    paths: ['manifest.json', '.github/workflows/store.yml']
  workflow_dispatch:
    inputs:
      force:
        description: 'לפרסם גם אם הגרסה כבר קיימת'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: store
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: תיקיית התוסף בלבד
        run: |
          mkdir -p /tmp/promo && for f in achat-promo.js achat-promo.css README.md; do curl -fsSL "https://raw.githubusercontent.com/Hadabadra/Mikvaot/main/shared/promo/$f" -o "/tmp/promo/$f"; done; python3 -c "import re,sys;v=lambda p:tuple(map(int,re.search(r'VERSION = \"([0-9.]+)',open(p,encoding='utf-8').read()).group(1).split('.')));sys.exit(0 if v('/tmp/promo/achat-promo.js')>=v('shared/promo/achat-promo.js') else 1)" && cp /tmp/promo/* shared/promo/ || echo "promo: העותק המקומי חדש יותר — נשאר"  # פרסומת "אחת שאלתי" — מקור יחיד ב-Mikvaot (אלא אם העותק כאן חדש יותר)
          python3 tools/build_roadmap.py docs/ROADMAP.md data/roadmap.js && python3 tools/build_roadmap.py CHANGELOG.md data/changelog.js KK_CHANGELOG
          mkdir -p dist/plugin
          cp -r manifest.json index.html background.html css js data icon shared dist/plugin/
          node -p "'לשון הקודש ' + require('./dist/plugin/manifest.json').version"
      - name: ולידציה, קיפול ופרסום
        timeout-minutes: 6
        uses: Otzaria/otzaria-plugin-validator@v1
        with:
          path: dist/plugin
          otzaria-user: ${{ secrets.OTZARIA_USER }}
          otzaria-password: ${{ secrets.OTZARIA_PASSWORD }}
          publish: 'auto'
          force: ${{ github.event.inputs.force || false }}
          screenshots: 'store-screenshots/01.png,store-screenshots/02.png'
          reports-consent: 'true'
